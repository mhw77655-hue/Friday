name: Friday formal contracts

on:
  push:
    branches: [ main ]
    paths:
      - formal/**
      - .github/workflows/formal.yml
      - .ralph/FRIDAY_DELIVERY_PLAN.md
  workflow_dispatch:

concurrency:
  group: friday-formal-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lean-formal:
    name: Lean 4 formal contract build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.36.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and check Friday formal contracts
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
          axiom-audit: true
          use-mathlib-cache: false
