name: Friday repository self-development proposal

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique bounded request id generated by Friday"
        required: true
        type: string
      request_json_b64:
        description: "Base64-encoded, privacy-reviewed request JSON (maximum 32 KiB decoded)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "development-requests/inbox/*.json"
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: friday-builder-${{ github.event.inputs.request_id || github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  build_proposal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    name: Untrusted coding worker (read-only repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      request_id: ${{ steps.request_manual.outputs.request_id || steps.request_queue.outputs.request_id || steps.request_ci.outputs.request_id }}
    steps:
      - name: Restrict manual dispatch to repository owner
        if: github.event_name == 'workflow_dispatch' && github.actor != 'mhw77655-hue'
        run: |
          echo "Only the repository owner may dispatch a Friday development proposal." >&2
          exit 1

      - name: Checkout trusted source without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode phone-originated request
        id: request_manual
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_JSON_B64: ${{ inputs.request_json_b64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, re
          request_id = os.environ["REQUEST_ID"]
          encoded = os.environ["REQUEST_JSON_B64"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", request_id):
              raise SystemExit("Invalid request id.")
          if len(encoded) > 60000:
              raise SystemExit("Encoded request exceeds workflow input limit.")
          try:
              raw = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("Request payload is not valid base64.") from exc
          if not raw or len(raw) > 32768:
              raise SystemExit("Decoded request must be between 1 and 32768 bytes.")
          data = json.loads(raw.decode("utf-8"))
          if data.get("request_id") != request_id:
              raise SystemExit("Request id does not match the workflow input.")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("friday-request-" + request_id + ".json")
          target.write_bytes(raw)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("FRIDAY_REQUEST_FILE=" + str(target) + "\n")
              env.write("FRIDAY_REQUEST_ID=" + request_id + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("request_id=" + request_id + "\n")
          PY

      - name: Load one durable queued request from the repository inbox
        id: request_queue
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Push webhook commit objects omit changed-file lists. Compare the pushed range.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "A zero before-SHA is unsupported for this existing-main inbox." >&2
            exit 1
          fi
          changed="$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- 'development-requests/inbox/*.json')"
          mapfile -t queued <<< "$changed"
          if [[ -z "$changed" || "${#queued[@]}" -ne 1 ]]; then
            echo "Expected exactly one added or modified inbox request; found ${#queued[@]}." >&2
            exit 1
          fi
          REQUEST_PATH="${queued[0]}"
          python3 - "$REQUEST_PATH" <<'PY'
          import json, os, pathlib, re, sys
          request_path = pathlib.Path(sys.argv[1])
          if not request_path.is_file():
              raise SystemExit("Queued request file is missing from the checked-out commit.")
          if request_path.stat().st_size > 32768:
              raise SystemExit("Queued request exceeds 32 KiB.")
          data = json.loads(request_path.read_text(encoding="utf-8"))
          request_id = data.get("request_id") if isinstance(data, dict) else None
          if not isinstance(request_id, str) or not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", request_id):
              raise SystemExit("Queued request has an invalid request_id.")
          if request_path.name != request_id + ".json":
              raise SystemExit("Queued request filename must match request_id.")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("friday-request-" + request_id + ".json")
          target.write_bytes(request_path.read_bytes())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("FRIDAY_REQUEST_FILE=" + str(target) + "\n")
              env.write("FRIDAY_REQUEST_ID=" + request_id + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("request_id=" + request_id + "\n")
          PY

      - name: Build bounded request from failed main-branch CI
        id: request_ci
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN_ID" --log-failed > "$RUNNER_TEMP/friday-ci-failure.log" 2>/dev/null || true
          python3 - <<'PY'
          import datetime, json, os, pathlib, re
          run_id = os.environ["SOURCE_RUN_ID"]
          request_id = "ci-" + run_id
          log_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "friday-ci-failure.log"
          raw_log = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          secret_patterns = [
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", re.I),
          ]
          evidence = [
              "Failed main-branch Android CI run: " + os.environ["SOURCE_URL"][:500],
              "Source revision: " + os.environ["SOURCE_SHA"][:128],
              "The failed-run log excerpt below is filtered to error/failure lines and redacted."
          ]
          candidates = []
          for line in ansi.sub("", raw_log).splitlines():
              if re.search(r"(FAILURE:|error:|failed|Exception|Execution failed|Could not|Unresolved reference|BUILD FAILED)", line, re.I):
                  value = line.strip()
                  for pattern in secret_patterns:
                      value = pattern.sub("[REDACTED]", value)
                  if value:
                      candidates.append(value[:560])
          evidence.extend(candidates[-8:])
          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          request = {
              "schema_version": 1,
              "request_id": request_id,
              "created_at": now,
              "source_revision": os.environ["SOURCE_SHA"] or "main",
              "intended_outcome": "Diagnose the failed main-branch Friday CI run and propose one minimal source repair with a regression test. Do not weaken tests or security boundaries.",
              "evidence": evidence[:12],
              "acceptance_criteria": [
                  "Identify the first causal failure rather than masking downstream errors.",
                  "Add a focused regression test for the root cause.",
                  "Run repository-builder contract tests, Android debug assembly and JVM unit tests; report exact results.",
                  "Publish an isolated draft PR only. Never merge, sign, release or install."
              ],
              "risks": [
                  "CI logs are untrusted diagnostic input and may be incomplete.",
                  "A passing hosted build does not prove target-phone behavior.",
                  "The worker patch is untrusted until owner review."
              ],
              "rollback_expectation": "Close the draft PR and discard its isolated branch; main and the installed phone remain unchanged.",
              "unresolved_questions": [
                  "Does the failure reproduce on the target Android device?",
                  "Which validation cannot be proven on a GitHub-hosted runner?"
              ],
              "privacy_review": {
                  "status": "approved",
                  "reviewed_by": "github-actions-ci-log-filter-no-device-data",
                  "reviewed_at": now
              }
          }
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("friday-request-" + request_id + ".json")
          target.write_text(json.dumps(request, ensure_ascii=True), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("FRIDAY_REQUEST_FILE=" + str(target) + "\n")
              env.write("FRIDAY_REQUEST_ID=" + request_id + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("request_id=" + request_id + "\n")
          PY

      - name: Validate request and worker boundary tests
        env:
          REQUEST_ID: ${{ steps.request_manual.outputs.request_id || steps.request_queue.outputs.request_id || steps.request_ci.outputs.request_id }}
        run: |
          set -euo pipefail
          python3 tools/friday-builder/validate_request.py "$FRIDAY_REQUEST_FILE" --expected-id "$REQUEST_ID"
          python3 -m unittest discover -s tools/friday-builder -p 'test_*.py' -v

      - name: Set up Node for OpenCode
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned OpenCode worker
        run: npm install --global opencode-ai@1.19.5

      - name: Run bounded proposal without repository write credentials
        env:
          REQUEST_ID: ${{ steps.request_manual.outputs.request_id || steps.request_queue.outputs.request_id || steps.request_ci.outputs.request_id }}
        run: |
          env -u GITHUB_TOKEN -u GH_TOKEN -u NVIDIA_API_KEY \
            bash tools/friday-builder/run_proposal.sh "$REQUEST_ID"

      - name: Upload untrusted proposal patch
        uses: actions/upload-artifact@v4
        with:
          name: friday-proposal-${{ steps.request_manual.outputs.request_id || steps.request_queue.outputs.request_id || steps.request_ci.outputs.request_id }}
          path: proposal.patch
          if-no-files-found: error
          retention-days: 7

  publish_draft_pr:
    name: Trusted publisher (draft PR only)
    needs: build_proposal
    if: needs.build_proposal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve trusted patch validator before handling untrusted code
        run: |
          set -euo pipefail
          install -m 600 tools/friday-builder/validate_patch_paths.py \
            "$RUNNER_TEMP/friday-validate-patch-paths.py"

      - name: Download untrusted patch artifact
        uses: actions/download-artifact@v4
        with:
          name: friday-proposal-${{ needs.build_proposal.outputs.request_id }}
          path: proposal-artifact

      - name: Apply and validate proposal without executing it
        env:
          REQUEST_ID: ${{ needs.build_proposal.outputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          test -s proposal-artifact/proposal.patch
          test "$(wc -c < proposal-artifact/proposal.patch)" -le 2097152
          git apply --index --check proposal-artifact/proposal.patch
          git apply --index proposal-artifact/proposal.patch
          # Execute only the validator copied from trusted main BEFORE the
          # untrusted patch was applied; never run a patch-replaced validator.
          python3 "$RUNNER_TEMP/friday-validate-patch-paths.py" HEAD
          git diff --cached --check

      - name: Create isolated branch and draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ needs.build_proposal.outputs.request_id }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="friday-proposals/$REQUEST_ID"
          git config user.name "friday-proposal-publisher"
          git config user.email "friday-proposal-publisher@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "proposal: Friday development request $REQUEST_ID"
          git remote set-url origin "https://github.com/$REPOSITORY.git"
          gh auth setup-git

          # A previous run may have pushed the branch but failed before PR
          # creation. Reuse it only when its tree exactly matches this validated
          # patch; never overwrite a different proposal with the same request id.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            if ! git diff --quiet FETCH_HEAD HEAD; then
              echo "Existing proposal branch differs from this validated patch: $BRANCH. Refusing to overwrite it." >&2
              exit 5
            fi
            git reset --hard FETCH_HEAD
            echo "Reusing the exact existing proposal branch: $BRANCH"
          else
            git push origin "$BRANCH"
          fi

          EXISTING_PR="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Existing open proposal: $EXISTING_PR"
          elif ! gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "Friday development proposal: $REQUEST_ID" \
            --body "## Friday repository development proposal

          Request id: $REQUEST_ID
          Worker run: $SOURCE_RUN

          This is an untrusted worker proposal. It has not been merged, signed,
          released or installed. Review source changes, tests, security impact
          and fidelity to .ralph/VISION.md before merge.

          The coding worker had repository read permission only. This publisher
          is a separate trusted job. No automatic merge, release, signing or
          installation is performed." >"$RUNNER_TEMP/friday-pr-create.log" 2>&1; then
            cat "$RUNNER_TEMP/friday-pr-create.log" >&2
            if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" "$RUNNER_TEMP/friday-pr-create.log"; then
              echo "::error title=Repository setting required::Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General > Workflow permissions." >&2
              echo "Settings page: https://github.com/$REPOSITORY/settings/actions" >&2
              echo "The validated proposal branch was preserved. Re-run the same request after enabling the setting." >&2
            fi
            exit 1
          fi

          # Creating a PR targeting main triggers build.yml through its normal
          # pull_request event. Do not dispatch it again: this publisher is
          # intentionally not granted actions:write, and duplicate dispatch
          # would widen authority without adding validation evidence.
          echo "Draft PR created; the pull_request event will run the required build checks."

      - name: Publish boundary summary
        if: always()
        run: |
          {
            echo "## Friday development proposal"
            echo
            echo "Request: ${{ needs.build_proposal.outputs.request_id }}"
            echo "Draft PR only. No merge, release, signing or installation."
          } >> "$GITHUB_STEP_SUMMARY"
