name: Friday live inspection service

on:
  push:
    branches: [ main ]
    paths:
      - services/friday-inspection/**
      - .github/workflows/friday-inspection-service.yml
  pull_request:
    paths:
      - services/friday-inspection/**
      - .github/workflows/friday-inspection-service.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/friday-inspection
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
