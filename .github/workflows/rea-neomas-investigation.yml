name: Friday REA Neomas website investigation

on:
  push:
    branches: [main]
    paths:
      - "scripts/rea/**"
      - ".github/workflows/rea-neomas-investigation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friday-rea-neomas
  cancel-in-progress: true

jobs:
  inspect-neomas:
    name: Passively reverse-engineer the public Neomas website with REA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Friday
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js required by REA
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Install a disposable Chrome browser
        uses: browser-actions/setup-chrome@v1

      - name: Record the pinned upstream REA package integrity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="6.10.1"
          INTEGRITY="$(npm view "rea-agents@$VERSION" dist.integrity)"
          test -n "$INTEGRITY"
          echo "REA_PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "REA_PACKAGE_INTEGRITY=$INTEGRITY" >> "$GITHUB_ENV"
          echo "REA_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "REA_OUTPUT_DIR=neomas-rea-evidence" >> "$GITHUB_ENV"

      - name: Validate the Neomas REA runner
        run: node --check scripts/rea/inspect-neomas.mjs

      - name: Run real upstream REA against Neomas
        env:
          NEOMAS_URL: https://neomas.app/
        run: node scripts/rea/inspect-neomas.mjs

      - name: Upload Neomas REA evidence and Friday assimilation packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-rea-neomas
          path: neomas-rea-evidence/
          if-no-files-found: warn
          retention-days: 30
