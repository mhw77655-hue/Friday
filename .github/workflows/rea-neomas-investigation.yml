name: Friday REA Neomas website investigation
run-name: Friday REA Neomas investigation ${{ github.event.inputs.investigation_id || github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/rea/**"
      - "tools/rea/evidence-converter.mjs"
      - ".github/workflows/rea-neomas-investigation.yml"
  workflow_dispatch:
    inputs:
      investigation_id:
        description: Friday-generated durable investigation identifier
        required: true
        type: string
      target_url:
        description: Public Neomas HTTPS URL
        required: false
        default: https://neomas.app/
        type: string

permissions:
  contents: read

concurrency:
  group: friday-rea-neomas
  cancel-in-progress: true

jobs:
  inspect-neomas:
    name: Passively reverse-engineer the public Neomas website with REA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Friday
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js required by REA
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Install a disposable Chrome browser
        uses: browser-actions/setup-chrome@v1

      - name: Record the pinned upstream REA package integrity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="6.10.1"
          INTEGRITY="$(npm view "rea-agents@$VERSION" dist.integrity)"
          test -n "$INTEGRITY"
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          {
            printf 'REA_PACKAGE_VERSION=%s\n' "$VERSION"
            printf 'REA_PACKAGE_INTEGRITY=%s\n' "$INTEGRITY"
            printf 'REA_BROWSER_EXECUTABLE=%s\n' "$CHROME_BIN"
            printf 'REA_OUTPUT_DIR=neomas-rea-evidence\n'
          } >> "$GITHUB_ENV"

      - name: Validate the Neomas REA runner
        run: node --check scripts/rea/inspect-neomas.mjs

      - name: Run real upstream REA against Neomas
        env:
          NEOMAS_URL: ${{ github.event.inputs.target_url || 'https://neomas.app/' }}
          NEOMAS_INVESTIGATION_ID: ${{ github.event.inputs.investigation_id || github.run_id }}
        run: node scripts/rea/inspect-neomas.mjs

      - name: Upload Neomas REA evidence and Friday assimilation packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-rea-neomas
          path: neomas-rea-evidence/
          if-no-files-found: warn
          retention-days: 30
