name: Friday signed release

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: Build a signed release even if no Android source changed since the previous release
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: friday-signed-release-main
  cancel-in-progress: false

jobs:
  signed-release:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      FORCE_RELEASE: ${{ github.event.inputs.force_release || 'false' }}
    steps:
      - name: Check all permanent signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.FRIDAY_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FRIDAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FRIDAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FRIDAY_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.FRIDAY_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=(FRIDAY_RELEASE_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(FRIDAY_RELEASE_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(FRIDAY_RELEASE_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(FRIDAY_RELEASE_KEY_PASSWORD)
          [[ -n "$CERT_SHA256" ]] || missing+=(FRIDAY_RELEASE_CERT_SHA256)
          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain one-time signing setup
        if: steps.signing.outputs.configured == 'false'
        run: |
          {
            echo "## Friday release not published"
            echo
            echo "The permanent production signing identity is not fully configured."
            echo "Follow docs/FRIDAY_RELEASE_SIGNING_SETUP.md and add all five FRIDAY_RELEASE_* repository secrets."
            echo "No debug APK is promoted as a production release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the exact CI-verified main commit
        if: steps.signing.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify APK-bundled delivery plan matches canonical source
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if ! cmp -s .ralph/FRIDAY_DELIVERY_PLAN.md mobile/app/src/main/assets/friday/FRIDAY_DELIVERY_PLAN.md; then
            echo "::error::Refusing signed release: APK-bundled delivery plan diverges from canonical source."
            diff -u .ralph/FRIDAY_DELIVERY_PLAN.md mobile/app/src/main/assets/friday/FRIDAY_DELIVERY_PLAN.md || true
            exit 1
          fi

      - name: Ensure no Android product changes landed after this CI build
        id: freshness
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_MAIN_SHA"; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-ancestor CI build $TARGET_SHA; main is now $CURRENT_MAIN_SHA."
            exit 0
          fi
          PRODUCT_CHANGES="$(git diff --name-only "$TARGET_SHA" "$CURRENT_MAIN_SHA" -- mobile/ gradle/ build.gradle.kts settings.gradle.kts gradle.properties jniLibs/ local-repo/)"
          if [[ -z "$PRODUCT_CHANGES" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "No Android product/build inputs changed after verified build $TARGET_SHA."
            echo "Documentation-only commits do not invalidate an otherwise current APK."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping build $TARGET_SHA because Android product/build inputs changed after it:"
            printf '%s\n' "$PRODUCT_CHANGES"
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create isolated writable Android SDK
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          SDK_ROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install pinned Android release build components
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Check whether Android product code changed since last release
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true'
        id: changes
        run: |
          set -euo pipefail
          if [[ "$FORCE_RELEASE" == "true" ]]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG="$(gh release list --repo "$REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No previous signed release; first release is required."
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "refs/tags/$LATEST_TAG:refs/tags/$LATEST_TAG"
          PREVIOUS_RELEASE_SHA="$(git rev-list -n 1 "$LATEST_TAG")"
          if ! git merge-base --is-ancestor "$PREVIOUS_RELEASE_SHA" "$TARGET_SHA"; then
            echo "Latest release tag is not an ancestor of this main commit; publishing a new verified release."
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES="$(git diff --name-only "$PREVIOUS_RELEASE_SHA" "$TARGET_SHA")"
          if grep -Eq '^(mobile/app/|gradle/|build.gradle.kts|settings.gradle.kts|gradle.properties)' <<< "$CHANGED_FILES"; then
            echo "Android product/build source changed."
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Android product/build source changed; no release needed."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode the permanent release keystore
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.FRIDAY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/friday-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "FRIDAY_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build the signed production APK
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true'
        env:
          FRIDAY_RELEASE_STORE_PASSWORD: ${{ secrets.FRIDAY_RELEASE_STORE_PASSWORD }}
          FRIDAY_RELEASE_KEY_ALIAS: ${{ secrets.FRIDAY_RELEASE_KEY_ALIAS }}
          FRIDAY_RELEASE_KEY_PASSWORD: ${{ secrets.FRIDAY_RELEASE_KEY_PASSWORD }}
          FRIDAY_SOURCE_REVISION: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "FRIDAY_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "FRIDAY_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ./gradlew :mobile:app:assembleRelease \
            -PfridayVersionCode="$VERSION_CODE" \
            -PfridayVersionName="$VERSION_NAME"

      - name: Verify APK signature and produce release metadata
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.FRIDAY_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/friday-apk-certificate.txt"
          ACTUAL_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$RUNNER_TEMP/friday-apk-certificate.txt" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL_CERT_SHA256" || "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "APK signing certificate does not match the pinned release fingerprint." >&2
            exit 30
          fi
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "friday.apk" > "$RUNNER_TEMP/friday.apk.sha256"
          python3 - "$FRIDAY_VERSION_CODE" "$FRIDAY_VERSION_NAME" "$TARGET_SHA" "$ACTUAL_CERT_SHA256" "$APK_SHA256" > "$RUNNER_TEMP/friday-release-metadata.json" <<'PY'
          import json, sys
          version_code, version_name, commit, certificate, apk_sha = sys.argv[1:]
          print(json.dumps({
              "schema_version": 1,
              "application_id": "ai.friday.assistant",
              "version_code": int(version_code),
              "version_name": version_name,
              "commit_sha": commit,
              "certificate_sha256": certificate,
              "apk_sha256": apk_sha,
              "update_mode": "same-signature-in-place"
          }, separators=(",", ":")))
          PY

      - name: Recheck Android source freshness immediately before publication
        id: final_freshness
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_MAIN_SHA"; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Withholding signed release: target commit is no longer an ancestor of main."
            exit 0
          fi
          PRODUCT_CHANGES="$(git diff --name-only "$TARGET_SHA" "$CURRENT_MAIN_SHA" -- mobile/ gradle/ build.gradle.kts settings.gradle.kts gradle.properties jniLibs/ local-repo/)"
          if [[ -n "$PRODUCT_CHANGES" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Withholding signed release: Android product/build inputs changed while the APK was being built:"
            printf '%s\n' "$PRODUCT_CHANGES"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "The signed APK still matches the current Android product source."
          fi

      - name: Explain source changed during signed build
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true' && steps.final_freshness.outputs.current == 'false'
        run: |
          {
            echo "## Signed APK withheld from production publication"
            echo
            echo "Android product/build source changed after the CI-verified target while the signed APK was building."
            echo "The APK will not be published as the current update. A fresh main build and signed release are required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select release publisher credential
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true' && steps.final_freshness.outputs.current == 'true'
        env:
          DEDICATED_RELEASE_TOKEN: ${{ secrets.FRIDAY_RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DEDICATED_RELEASE_TOKEN" ]]; then
            echo "GH_TOKEN=$DEDICATED_RELEASE_TOKEN" >> "$GITHUB_ENV"
            echo "Using the dedicated FRIDAY_RELEASE_PUBLISH_TOKEN for release publication." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Using the workflow GITHUB_TOKEN for release publication." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve verified signed APK even if release publication is blocked
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true' && steps.final_freshness.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: friday-signed-release-${{ github.run_number }}
          path: |
            mobile/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/friday-release-metadata.json
            ${{ runner.temp }}/friday.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish the signed release
        id: publish
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'true' && steps.changes.outputs.release_needed == 'true' && steps.final_freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.FRIDAY_RELEASE_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="friday-v$FRIDAY_VERSION_NAME"
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          METADATA="$RUNNER_TEMP/friday-release-metadata.json"
          CHECKSUM="$RUNNER_TEMP/friday.apk.sha256"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#friday.apk" "$METADATA" "$CHECKSUM" --clobber --repo "$REPOSITORY"
          else
            gh release create "$TAG" "$APK#friday.apk" "$METADATA" "$CHECKSUM" \
              --repo "$REPOSITORY" \
              --title "Friday $FRIDAY_VERSION_NAME" \
              --notes "CI-verified signed Friday Android release. Commit: $TARGET_SHA. APK certificate is checked against the pinned release fingerprint." \
              --target "$TARGET_SHA"
          fi
          {
            echo "## Signed Friday release published"
            echo
            echo "- Version: $FRIDAY_VERSION_NAME ($FRIDAY_VERSION_CODE)"
            echo "- Tag: $TAG"
            echo "- Commit: $TARGET_SHA"
            echo "- Asset: friday.apk"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Explain stale CI build
        if: steps.signing.outputs.configured == 'true' && steps.freshness.outputs.current == 'false'
        run: echo "No release published because this CI result is not for the current main revision." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain release publication permission failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          {
            echo "## Release publication failed after APK build/signing"
            echo
            echo "The signed APK and checksum were preserved as the workflow artifact."
            echo "The GitHub API denied release creation/upload. Check repository Settings → Actions → General → Workflow permissions and allow GITHUB_TOKEN read/write access to repository contents."
            echo "If an organization policy or ruleset still denies GITHUB_TOKEN release writes, add an owner-controlled fine-grained token with Contents: read/write as the FRIDAY_RELEASE_PUBLISH_TOKEN repository secret."
            echo "Do not install an older release or a debug APK as a substitute."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped release
        if: steps.signing.outputs.configured == 'true' && steps.changes.outputs.release_needed == 'false'
        run: echo "No Android app/build changes since the latest signed release." >> "$GITHUB_STEP_SUMMARY"
