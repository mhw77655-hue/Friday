name: Purge private owner archives from Git history

on:
  push:
    branches: [main]
    paths:
      - .github/PRIVATE_ARCHIVE_PURGE_PENDING
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: friday-private-archive-history-purge
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm the one-time purge is pending
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/PRIVATE_ARCHIVE_PURGE_PENDING

      - name: Install git-filter-repo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade git-filter-repo
          git filter-repo --version

      - name: Remove raw archives from every reachable history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/friday-history-purge-report"
          mkdir -p "$report_dir"

          # --sensitive-data-removal fetches and processes all refs. Keep the
          # raw archive contents out of logs and artifacts; only retain Git's
          # ref/commit mapping and operational report.
          git filter-repo --force --sensitive-data-removal --invert-paths \
            --path "New Folder chats.zip" \
            --path "New folder.zip" \
            --path ".github/PRIVATE_ARCHIVE_PURGE_PENDING" \
            2>&1 | tee "$report_dir/filter-repo.log"

          if [ -f .git/filter-repo/changed-refs ]; then
            cp .git/filter-repo/changed-refs "$report_dir/changed-refs.txt"
          fi
          if [ -f .git/filter-repo/commit-map ]; then
            cp .git/filter-repo/commit-map "$report_dir/commit-map.txt"
          fi

          # Verify every locally reachable rewritten ref before any force push.
          if git rev-list --objects --all | grep -E ' (New Folder chats\.zip|New folder\.zip|\.github/PRIVATE_ARCHIVE_PURGE_PENDING)$'; then
            echo "A private archive or purge marker remains reachable after rewrite."
            exit 1
          fi

          # git-filter-repo removes origin deliberately to prevent accidental
          # pushes. Re-add it with the scoped workflow token.
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          set +e
          git push --force --mirror origin 2>&1 | tee "$report_dir/push.log"
          push_status=${PIPESTATUS[0]}
          set -e

          if [ "$push_status" -ne 0 ]; then
            non_pull_rejections="$(grep -E 'remote rejected' "$report_dir/push.log" | grep -v 'refs/pull/' || true)"
            pull_rejections="$(grep -E 'remote rejected.*refs/pull/' "$report_dir/push.log" || true)"
            if [ -n "$non_pull_rejections" ] || [ -z "$pull_rejections" ]; then
              echo "History rewrite push failed for a ref other than GitHub's read-only pull-request refs."
              exit 1
            fi
            echo "Only GitHub's read-only refs/pull/* were rejected; branch and tag refs were pushed."
          fi

          echo "History rewrite and branch/tag push completed. GitHub Support cleanup of cached views and pull-request refs may still be required."

      - name: Upload history rewrite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-private-archive-history-purge-report
          path: ${{ runner.temp }}/friday-history-purge-report/
          if-no-files-found: warn
          retention-days: 30
