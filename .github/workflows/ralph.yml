name: ralph
on:
  workflow_dispatch:
    inputs:
      stories:
        description: "Story ids to finish, space separated, or ALL"
        default: "LAUNCH-WAKE-ORDER"
      relay:
        description: "Relay counter, leave 0"
        default: "0"
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
concurrency:
  group: ralph
  cancel-in-progress: false
jobs:
  ralph:
    if: github.actor == 'mhw77655-hue' || (github.actor == 'github-actions[bot]' && inputs.relay != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STORIES: ${{ inputs.stories }}
      RELAY: ${{ inputs.relay }}
    steps:
      - name: Restrict dispatch to the owner or an authenticated relay
        env:
          ACTOR: ${{ github.actor }}
          RELAY: ${{ inputs.relay }}
        run: |
          if [[ "$ACTOR" != "mhw77655-hue" && ! ( "$ACTOR" == "github-actions[bot]" && "$RELAY" != "0" ) ]]; then
            echo "Only the repository owner may start Cloud Ralph; bot relays require a non-zero relay counter." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloud Ralph
        run: |
          cp -r .ralph/cloud "$RUNNER_TEMP/cloud"
          bash "$RUNNER_TEMP/cloud/run.sh"
