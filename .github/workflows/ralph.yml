name: ralph
on:
  workflow_dispatch:
    inputs:
      stories:
        description: "Story ids to finish, space separated, or ALL"
        default: "LAUNCH-WAKE-ORDER"
      relay:
        description: "Relay counter, leave 0"
        default: "0"
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: ralph
  cancel-in-progress: false
jobs:
  ralph:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STORIES: ${{ inputs.stories }}
      RELAY: ${{ inputs.relay }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloud Ralph
        run: |
          cp -r .ralph/cloud "$RUNNER_TEMP/cloud"
          bash "$RUNNER_TEMP/cloud/run.sh"
