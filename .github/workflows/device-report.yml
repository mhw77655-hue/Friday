name: Friday device report archive

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  archive-device-report:
    if: startsWith(github.event.issue.title, '[Friday device report] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Validate and write sanitized device report
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const title = process.env.ISSUE_TITLE || '';
            const body = process.env.ISSUE_BODY || '';
            if (Buffer.byteLength(body, 'utf8') > 48000) {
              core.setFailed('Friday device report exceeds the 48 KiB issue-body safety limit.');
              return;
            }
            const begin = 'FRIDAY_DEVICE_REPORT_JSON_BEGIN';
            const end = 'FRIDAY_DEVICE_REPORT_JSON_END';
            const start = body.indexOf(begin);
            const finish = body.indexOf(end);
            if (start < 0 || finish <= start) {
              core.setFailed('Friday report payload boundaries are missing.');
              return;
            }
            const jsonText = body.slice(start + begin.length, finish).trim();
            let report;
            try {
              report = JSON.parse(jsonText);
            } catch (_) {
              core.setFailed('Friday report payload is not valid JSON.');
              return;
            }
            if (report.report_type !== 'FRIDAY_LIVE_TEST_REPORT' || report.schema_version !== 1) {
              core.setFailed('Unsupported Friday device report schema.');
              return;
            }
            if (typeof report.report_id !== 'string' || !/^[A-Za-z0-9-]{8,80}$/.test(report.report_id)) {
              core.setFailed('Friday report id is missing or malformed.');
              return;
            }
            if (!title.endsWith(report.report_id)) {
              core.setFailed('Issue title does not match the report id.');
              return;
            }
            const serialized = JSON.stringify(report);
            const secretPattern = /(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|bearer\s+[A-Za-z0-9._-]{20,})/i;
            if (secretPattern.test(serialized)) {
              core.setFailed('Friday report was rejected because it resembles a credential.');
              return;
            }
            const output = path.join(process.env.RUNNER_TEMP, 'friday-device-report');
            fs.mkdirSync(output, { recursive: true });
            fs.writeFileSync(path.join(output, 'device-report.json'), JSON.stringify(report, null, 2), { mode: 0o600 });
            core.summary.addHeading('Friday device report accepted');
            core.summary.addTable([
              [{ data: 'Field', header: true }, { data: 'Value', header: true }],
              ['Report id', report.report_id],
              ['App version', String(report.app_version || 'unknown')],
              ['Android API', String(report.android_api || 'unknown')],
              ['Source revision', String(report.source_revision || 'unknown')],
              ['Action events', String(Array.isArray(report.events) ? report.events.length : 0)]
            ]);
            core.summary.addRaw('The report contains technical diagnostics only. Conversation and screen content are not part of this report.');
            core.setOutput('report_id', report.report_id);
      - name: Archive validated report
        uses: actions/upload-artifact@v4
        with:
          name: friday-device-report-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/friday-device-report/device-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Acknowledge report on GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Friday accepted and archived this device report.',
                '',
                '- Validation run: ' + runUrl,
                '- Artifact: friday-device-report-' + context.issue.number,
                '- Artifact retention: 14 days',
                '',
                'The report was validated for schema, report identity, size and credential-like content.'
              ].join('\n')
            });
