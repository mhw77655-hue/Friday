name: build

on:
  push:
    # `audit/**` exists so the AUDIT-TOOL can prove its draft patch compiles
    # and passes the suite on a branch of its own, unmerged. Without this the
    # patch could only ever be verified by merging it, which is the one thing
    # the tool must never do. Nothing under audit/** is merged by CI or by the
    # tool; a run there is evidence, not a gate on main.
    branches: [ main, 'audit/**', 'friday-proposals/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Temporary source-inspection bridge for the user's uploaded archive.
      # Extract in the runner, publish as a workflow artifact, and inspect the
      # real source tree before changing application code.
      - name: Extract uploaded New folder archive
        run: |
          # The user's upload is on main; this isolated audit branch predates it.
          git fetch --depth=1 origin main
          git show FETCH_HEAD:"New folder.zip" > "$RUNNER_TEMP/New folder.zip"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          archive = Path(os.environ["RUNNER_TEMP"]) / "New folder.zip"
          target = Path(os.environ["RUNNER_TEMP"]) / "friday-new-folder-source"
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              bad = [n for n in z.namelist() if Path(n).is_absolute() or ".." in Path(n).parts]
              if bad:
                  raise SystemExit(f"Unsafe archive paths: {bad[:10]}")
              z.extractall(target)
          files = sorted(p for p in target.rglob("*") if p.is_file())
          report = Path(os.environ["RUNNER_TEMP"]) / "new-folder-manifest.txt"
          report.write_text("\\n".join(f"{p.relative_to(target)}\\t{p.stat().st_size}" for p in files), encoding="utf-8")
          print(f"Extracted {len(files)} files ({sum(p.stat().st_size for p in files)} bytes)")
          print(report.read_text(encoding="utf-8")[:20000])
          PY

      - name: Upload extracted New folder source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: new-folder-extracted-source
          path: |
            ${{ runner.temp }}/friday-new-folder-source
            ${{ runner.temp }}/new-folder-manifest.txt
          if-no-files-found: error

      # JDK 17: the repo's Gradle/AGP configuration requires it. Read from
      # mobile/app/build.gradle.kts (compileOptions source/targetCompatibility =
      # VERSION_17, kotlin compilerOptions jvmTarget = JVM_17) and the root
      # build.gradle.kts (AGP 8.10.0, which requires JDK 17).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Writable SDK root for this job. MUST be exported inside a step (not in
      # a job-level env block): the runner context is not allowed there and
      # GitHub rejects the whole workflow. The runner-image SDK at
      # /usr/local/lib/android/sdk is read-only, so components pinned by
      # mobile/app/build.gradle.kts go here instead.
      - name: Set ANDROID_HOME for the job
        run: |
          echo "ANDROID_HOME=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"

      # SDK versions pinned by mobile/app/build.gradle.kts: compileSdk = 36,
      # ndkVersion = 27.3.13750724, externalNativeBuild cmake version 3.22.1,
      # AGP 8.10.0 default build-tools 35.0.0.
      - name: Install Android SDK components into writable SDK root
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          mkdir -p "$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" \
            --sdk_root="$ANDROID_HOME"


      - name: Set up Python for repository-builder contract tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test repository-builder request boundary
        run: python3 -m unittest discover -s tools/friday-builder -p 'test_*.py' -v

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :mobile:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      # Baseline unit-test run for this stage.
      - name: Run unit tests (baseline)
        run: ./gradlew :mobile:app:testDebugUnitTest

      - name: Print JUnit failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('mobile/app/build/test-results/**/TEST-*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  error = case.find('error')
                  issue = failure if failure is not None else error
                  if issue is not None:
                      print(f"FAILED: {case.get('classname')}.{case.get('name')}")
                      print(issue.get('message', ''))
                      print((issue.text or '')[-6000:])
          PY

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: mobile/app/build/test-results/**/TEST-*.xml

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, os
          paths = glob.glob('mobile/app/build/test-results/**/TEST-*.xml', recursive=True)
          if not paths:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## JUnit baseline\n\nNO JUNIT FILES: the tests did not run\n')
              raise SystemExit(0)
          t = f = e = s = 0
          for p in paths:
              with open(p, encoding='utf-8', errors='replace') as fh:
                  c = fh.read()
              m = re.search(r'<testsuite\b[^>]*>', c)
              if not m:
                  continue
              def num(attr):
                  mm = re.search(r'\b%s="(\d+)"' % attr, m.group(0))
                  return int(mm.group(1)) if mm else 0
              t += num('tests'); f += num('failures'); e += num('errors'); s += num('skipped')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'## JUnit baseline\n\n{t} tests, {f} failures, {e} errors, {s} skipped\n')
          PY