name: build

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/**
      - mobile/app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradle.properties
      - jniLibs/**
      - local-repo/**
      - tools/friday-builder/**
      - .ralph/audit.py
      - .ralph/owner_vision_check.sh
      - .ralph/FRIDAY_DELIVERY_PLAN.md
      - .ralph/VISION.md
      - .ralph/OWNER_WORDS.md
      - governance/**
      - scripts/verify_repository_truth.py
      - tools/friday-builder/test_repository_truth.py
      - docs/FRIDAY_SELF_GOVERNANCE_AND_REPOSITORY_TRUTH.md
      - docs/OBJECTIVE_1_FOUNDATION_ACCEPTANCE.md
      - docs/OBJECTIVE_1_ADVERSARIAL_VALIDATION_PLAN.md
      - docs/OBJECTIVE_1_SOURCE_AUDIT_TRIAGE.md
      - docs/FRIDAY_INSTALL_ONCE_UPDATE_CHANNEL.md
      - AGENTS.md
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

concurrency:
  # Only the newest commit for a PR is a valid release candidate. Cancel
  # obsolete candidates so a slow stale test run cannot block its repair.
  # A per-commit group lets the newest run start immediately. The first job
  # explicitly cancels older runs for the same PR before expensive validation.
  group: friday-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Concurrency groups are per commit so a fresh candidate never waits behind
  # a stale run. Cancel older runs for this same PR before launching build work.
  cancel-stale-runs:
    name: Cancel obsolete PR validation runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs for this pull request
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("No pull request context; nothing to supersede.");
              return;
            }
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build.yml",
              per_page: 100
            });
            const currentRunId = Number(context.runId);
            if (!Number.isSafeInteger(currentRunId)) {
              throw new Error(`Invalid current workflow run ID: ${context.runId}`);
            }
            const stale = response.data.workflow_runs.filter(run =>
              run.id < currentRunId &&
              run.event === "pull_request" &&
              run.status !== "completed" &&
              (run.pull_requests || []).some(item => item.number === pr.number)
            );
            for (const run of stale) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                core.info(`Cancelled stale run ${run.id} for PR #${pr.number} at ${run.head_sha}`);
              } catch (error) {
                core.warning(`Could not cancel stale run ${run.id}: ${error.message}`);
              }
            }

  # Validate the canonical main commit; never treat a skipped check as success.
  debug-apk:
    needs: cancel-stale-runs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # JDK 17: the repo's Gradle/AGP configuration requires it. Read from
      # mobile/app/build.gradle.kts (compileOptions source/targetCompatibility =
      # VERSION_17, kotlin compilerOptions jvmTarget = JVM_17) and the root
      # build.gradle.kts (AGP 8.10.0, which requires JDK 17).
      - name: Verify Friday's canonical vision and repository authority
        run: bash .ralph/owner_vision_check.sh

      - name: Verify APK-bundled delivery plan matches canonical source
        run: |
          set -euo pipefail
          if ! cmp -s .ralph/FRIDAY_DELIVERY_PLAN.md mobile/app/src/main/assets/friday/FRIDAY_DELIVERY_PLAN.md; then
            echo "::error::The APK-bundled delivery plan diverges from the canonical plan."
            diff -u .ralph/FRIDAY_DELIVERY_PLAN.md mobile/app/src/main/assets/friday/FRIDAY_DELIVERY_PLAN.md || true
            exit 1
          fi

      - name: Set up Python for Android harness contract tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Android harness and build contracts
        id: harness-contracts
        # Keep APK compilation and device validation running even when a
        # fast harness contract test fails. The failure is re-enforced below,
        # so this never turns a red test into a passing candidate.
        continue-on-error: true
        run: python3 -m unittest discover -s tools/friday-builder -p 'test_*.py' -v

      - name: Measure Python line and branch coverage
        id: python-coverage
        # This repeats the fast harness suite under coverage. Keep independent
        # Android compilation running if either invocation exposes a test bug;
        # the enforcement step below still fails the job and blocks promotion.
        continue-on-error: true
        run: |
          python3 -m pip install coverage==7.6.12
          python3 -m coverage run --branch --source=.ralph,tools/friday-builder -m unittest discover -s tools/friday-builder -p 'test_*.py' -v
          python3 -m coverage xml -o "$RUNNER_TEMP/friday-python-coverage.xml" --omit='*/test_*.py'
          python3 -m coverage report --omit='*/test_*.py' -m

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-python-coverage
          path: ${{ runner.temp }}/friday-python-coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Verify repository authority and capability evidence policy
        run: python3 scripts/verify_repository_truth.py

      - name: Set up Go for workflow lint
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Lint all GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Validate REA candidate investigation script syntax
        run: node --check tools/rea/inspect-candidate-apk.mjs

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle dependency and build-output cache
        uses: gradle/actions/setup-gradle@v6

      # Writable SDK root for this job. MUST be exported inside a step (not in
      # a job-level env block): the runner context is not allowed there and
      # GitHub rejects the whole workflow. The runner-image SDK at
      # /usr/local/lib/android/sdk is read-only, so components pinned by
      # mobile/app/build.gradle.kts go here instead.
      - name: Set ANDROID_HOME for the job
        id: android-home
        run: |
          echo "ANDROID_HOME=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"

      - name: Restore pinned Android build SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: friday-android-sdk-${{ runner.os }}-api36-bt35-ndk27d-cmake3221-${{ hashFiles('mobile/app/build.gradle.kts') }}
          restore-keys: |
            friday-android-sdk-${{ runner.os }}-api36-bt35-ndk27d-cmake3221-

      # SDK versions pinned by mobile/app/build.gradle.kts: compileSdk = 36,
      # ndkVersion = 27.3.13750724, externalNativeBuild cmake version 3.22.1,
      # AGP 8.10.0 default build-tools 35.0.0.
      - name: Install Android SDK components into writable SDK root
        id: install-sdk
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          mkdir -p "$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          packages=(
            "platforms;android-36"
            "build-tools;35.0.0"
            "ndk;27.3.13750724"
            "cmake;3.22.1"
          )
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "${packages[@]}" --sdk_root="$ANDROID_HOME"; then
              echo "Android build SDK installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::SDK installation attempt $attempt failed; removing corrupt partial downloads before retry"
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp" \
              "$ANDROID_HOME/platforms/android-36" \
              "$ANDROID_HOME/build-tools/35.0.0" \
              "$ANDROID_HOME/ndk/27.3.13750724" \
              "$ANDROID_HOME/cmake/3.22.1"
            sleep $((attempt * 8))
          done
          echo "::error::Android build SDK installation failed after three clean attempts"
          exit 1

      # Verify the app builds from its repository checkout without rewriting
      # a device-local binary path during CI.
      - name: Verify no Termux-only Android build override remains
        run: |
          if grep -n '^android.aapt2FromMavenOverride=' gradle.properties; then
            echo "Remove the device-local aapt2 override from gradle.properties."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: assemble-apk
        run: ./gradlew :mobile:app:assembleDebug

      # Wave 0 of the repository-structure repair: retain the actual Gradle
      # project and resolved dependency graphs alongside the lexical source
      # trace. This is build-graph evidence, not a compiler call graph.
      - name: Capture Gradle project and dependency structure
        id: gradle-structure
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && steps.setup-java.outcome == 'success' }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/friday-gradle-structure"
          mkdir -p "$OUT"
          ./gradlew --console=plain projects > "$OUT/projects.txt"
          ./gradlew --console=plain :mobile:app:dependencies --configuration debugCompileClasspath > "$OUT/debug-compile-dependencies.txt"
          ./gradlew --console=plain :mobile:app:dependencies --configuration debugRuntimeClasspath > "$OUT/debug-runtime-dependencies.txt"
          ./gradlew --console=plain :mobile:app:dependencies --configuration releaseRuntimeClasspath > "$OUT/release-runtime-dependencies.txt"
          printf 'Gradle project/dependency reports captured. These describe configured build dependencies, not source-level runtime reachability.\n' > "$OUT/README.txt"

      - name: Upload Gradle structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-gradle-structure
          path: ${{ runner.temp }}/friday-gradle-structure/
          if-no-files-found: warn
          retention-days: 30

      # Android Lint is a separate source/API/resource/accessibility gate.
      - name: Run Android Lint on the debug variant
        if: ${{ !cancelled() && steps.setup-java.outcome == 'success' && steps.android-home.outcome == 'success' && steps.install-sdk.outcome == 'success' }}
        run: ./gradlew :mobile:app:lintDebug

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-android-lint-report
          path: mobile/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Friday launcher icon is packaged
        run: |
          set -euo pipefail
          BADGING="$RUNNER_TEMP/friday-apk-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mobile/app/build/outputs/apk/debug/app-debug.apk | tee "$BADGING"
          if ! grep -Eq "^application: label='Friday' icon='[^']+'" "$BADGING"; then
            echo "::error::The built Friday APK has no resolvable launcher icon."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          # Internal candidate only; never present it as installable before all gates pass.
          name: unverified-debug-apk-candidate
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      # Mutation probe: prove the exhaustive authorization truth-table tests
      # detect a deliberately weakened HIGH-risk biometric gate. The script
      # restores the source before the full test suite and uses only this
      # disposable CI checkout.
      - name: Prove authorization tests kill a deliberate mutant
        # The destructive mutation campaign deliberately rebuilds/reruns seven
        # suites repeatedly. Keep it on explicit deep-validation runs rather
        # than delaying every install-candidate APK and its normal test gates.
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && steps.setup-java.outcome == 'success' && steps.android-home.outcome == 'success' && steps.install-sdk.outcome == 'success' }}
        run: bash tools/friday-builder/verify_mutation_sensitivity.sh

      # Release signing is verified independently while the six JVM test
      # shards execute in parallel. Neither lane masks the other's failures.
      - name: Build and verify release variant with a disposable CI key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/friday-ci-smoke.p12"
          PASSWORD="friday-ci-smoke-password"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias friday-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Friday CI Smoke,O=Friday,C=EG"
          FRIDAY_RELEASE_KEYSTORE_PATH="$KEYSTORE" \
          FRIDAY_RELEASE_STORE_PASSWORD="$PASSWORD" \
          FRIDAY_RELEASE_KEY_ALIAS="friday-release" \
          FRIDAY_RELEASE_KEY_PASSWORD="$PASSWORD" \
            ./gradlew :mobile:app:assembleRelease \
              -PfridayVersionCode=2001 \
              -PfridayVersionName=ci-smoke \
              -PfridayAbiFilters=arm64-v8a
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            mobile/app/build/outputs/apk/release/app-release.apk

      - name: Enforce Android harness and build contract results
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.harness-contracts.outcome }}" != "success" || "${{ steps.python-coverage.outcome }}" != "success" ]]; then
            echo "::error::Android harness/build contract or covered Python tests failed. APK and emulator evidence may be collected, but this candidate is not releasable."
            exit 1
          fi



  # The previous monolithic testDebugUnitTest task kept one CI job busy for
  # over an hour. Discover source packages, balance them deterministically,
  # and execute six disjoint Gradle test-filter shards on separate runners.
  jvm-unit-tests:
    name: JVM unit tests (shard ${{ matrix.shard }})
    needs: cancel-stale-runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6

      - name: Create writable Android SDK root
        run: |
          set -euo pipefail
          SDK_ROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore minimal Android SDK for JVM compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: friday-android-jvm-sdk-${{ runner.os }}-api36-bt35-${{ hashFiles('mobile/app/build.gradle.kts') }}
          restore-keys: |
            friday-android-jvm-sdk-${{ runner.os }}-api36-bt35-

      - name: Install only SDK components needed by JVM tests
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run deterministic JVM test shard
        run: python3 tools/friday-builder/run_jvm_test_shard.py --shard ${{ matrix.shard }} --gradle ./gradlew

      - name: Verify this shard executed tests and retained JUnit evidence
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          paths = sorted(glob.glob("mobile/app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not paths:
              raise SystemExit("This JVM shard produced no JUnit XML reports.")
          totals = {"tests": 0, "failures": 0, "errors": 0}
          for path in paths:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, "0"))
          print(f"Shard JUnit totals: {totals}")
          if totals["tests"] <= 0:
              raise SystemExit("This JVM shard matched zero tests.")
          if totals["failures"] or totals["errors"]:
              raise SystemExit("This JVM shard reported failures or errors.")
          PY

      - name: Upload shard JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-jvm-junit-${{ matrix.shard }}
          path: mobile/app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14

  # Aggregate every shard's XML and fail closed if a shard failed, emitted no
  # tests, or produced any JUnit failure/error. Matrix green alone is not enough.
  jvm-test-results:
    name: Aggregate JVM test evidence
    if: always()
    needs:
      - jvm-unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all shard JUnit reports
        uses: actions/download-artifact@v4
        with:
          pattern: friday-jvm-junit-*
          path: junit-results
          merge-multiple: true

      - name: Enforce complete passing JVM test evidence
        env:
          SHARDS_RESULT: ${{ needs.jvm-unit-tests.result }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          paths = sorted(glob.glob("junit-results/**/TEST-*.xml", recursive=True))
          if not paths:
              raise SystemExit("No JUnit XML reports were produced by any JVM shard.")
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in paths:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, "0"))
          print(f"JUnit reports: {len(paths)}")
          print("JUnit totals: " + ", ".join(f"{key}={value}" for key, value in totals.items()))
          print("Matrix result: " + os.environ.get("SHARDS_RESULT", "unknown"))
          if os.environ.get("SHARDS_RESULT") != "success":
              raise SystemExit("At least one JVM test shard did not pass.")
          if totals["tests"] <= 0:
              raise SystemExit("Zero tests executed; this is not a passing validation.")
          if totals["failures"] or totals["errors"]:
              raise SystemExit("JUnit reports test failures or errors.")
          PY

  android-emulator:
    name: Disposable Android phone twin (instrumented)
    needs: cancel-stale-runs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle dependency and build-output cache
        uses: gradle/actions/setup-gradle@v6

      - name: Create isolated writable Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore pinned Android emulator SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: friday-android-emulator-sdk-${{ runner.os }}-api35-systemimage35-${{ hashFiles('mobile/app/build.gradle.kts') }}
          restore-keys: |
            friday-android-emulator-sdk-${{ runner.os }}-api35-systemimage35-
            friday-android-sdk-${{ runner.os }}-

      - name: Install emulator and pinned native build components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          packages=(
            "platform-tools"
            "emulator"
            "platforms;android-36"
            "build-tools;35.0.0"
            "ndk;27.3.13750724"
            "cmake;3.22.1"
            "system-images;android-35;google_apis;x86_64"
          )
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${packages[@]}"; then
              echo "Disposable phone SDK installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::Emulator SDK installation attempt $attempt failed; clearing corrupt partial package downloads"
            rm -rf "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/.temp" \
              "$ANDROID_HOME/emulator" \
              "$ANDROID_HOME/platform-tools" \
              "$ANDROID_HOME/platforms/android-36" \
              "$ANDROID_HOME/build-tools/35.0.0" \
              "$ANDROID_HOME/ndk/27.3.13750724" \
              "$ANDROID_HOME/cmake/3.22.1" \
              "$ANDROID_HOME/system-images/android-35"
            sleep $((attempt * 10))
          done
          echo "::error::Disposable phone SDK installation failed after three clean attempts"
          exit 1

      - name: Build app and instrumentation APKs
        run: ./gradlew :mobile:app:assembleDebug :mobile:app:assembleDebugAndroidTest

      - name: Enable KVM acceleration for the disposable phone
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This runner does not expose /dev/kvm; x86_64 software emulation is too slow and unreliable for the instrumented phone gate."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The runner cannot access /dev/kvm after permission setup."
            ls -l /dev/kvm || true
            exit 1
          fi
          echo "ANDROID_KVM_READY: hardware acceleration is available"

      - name: Boot disposable virtual phone and apply sanitized baseline state
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect -memory 3072 -cores 2 -no-snapshot -wipe-data -timezone Etc/UTC
          script: bash tools/friday-builder/run_virtual_phone_tests.sh

      - name: Trace instrumented failures to source functions
        # Preserve diagnostics after test failures, but do not run against an
        # empty workspace when the whole job was cancelled during checkout.
        if: ${{ always() && !cancelled() && hashFiles('.ralph/code_trace.py') != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/friday-runtime-code-trace"
          args=()
          while IFS= read -r -d '' report; do
            args+=(--failure "$report")
          done < <(find mobile/app/build/test-results mobile/app/build/reports/androidTests mobile/app/build/outputs/androidTest-results -type f \( -name '*.xml' -o -name '*.txt' -o -name '*.log' \) -print0 2>/dev/null || true)
          python3 .ralph/code_trace.py --repo . --out-dir "$RUNNER_TEMP/friday-runtime-code-trace" "${args[@]}"

      - name: Upload failure-to-source traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-failure-to-source-traces
          path: ${{ runner.temp }}/friday-runtime-code-trace/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-virtual-phone-evidence
          path: |
            mobile/app/build/reports/androidTests/
            mobile/app/build/reports/coverage/
            mobile/app/build/outputs/androidTest-results/
            mobile/app/build/test-results/
            ${{ runner.temp }}/friday-emulator/
          if-no-files-found: warn
          retention-days: 7

  full-source-audit:
    name: Whole-repository source inventory and Kotlin vision audit
    needs: cancel-stale-runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inventory every tracked code file and audit all production Kotlin
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/friday-source-audit"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "friday-source-audit"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          paths = [p for p in paths if p]
          source_suffixes = {
              ".kt", ".kts", ".java", ".py", ".go", ".js", ".ts", ".tsx", ".jsx",
              ".sh", ".yml", ".yaml", ".gradle", ".xml", ".toml", ".properties",
          }
          inventory = []
          total_lines = 0
          for name in paths:
              if pathlib.PurePosixPath(name).suffix.lower() not in source_suffixes:
                  continue
              content = (root / name).read_text(encoding="utf-8", errors="replace")
              count = len(content.splitlines())
              total_lines += count
              inventory.append((name, count))
          inventory.sort()
          (out / "source-inventory.tsv").write_text(
              "lines\tpath\n" + "".join(f"{count}\t{name}\n" for name, count in inventory),
              encoding="utf-8",
          )

          production_kotlin = [
              name for name in paths
              if name.startswith("mobile/app/src/main/java/") and name.endswith(".kt")
          ]
          if not production_kotlin:
              raise SystemExit("No production Kotlin source files were found.")
          command = [
              sys.executable, ".ralph/audit.py", "--paths", *production_kotlin,
              "--no-model", "--out-dir", str(out),
          ]
          subprocess.run(command, check=True)
          subprocess.run([
              sys.executable, ".ralph/audit.py", "--self-audit",
              "--no-model", "--out-dir", str(out),
          ], check=True)

          subprocess.run([sys.executable, "-m", "compileall", "-q", ".ralph", "tools/friday-builder"], check=True)
          subprocess.run([
              sys.executable, "tools/friday-builder/source_test_inventory.py",
              "--output", str(out / "source-test-map.tsv"),
          ], check=True)
          shell_files = [name for name in paths if name.endswith(".sh")]
          for name in shell_files:
              first_line = pathlib.Path(name).read_text(encoding="utf-8", errors="replace").splitlines()[:1]
              if first_line and "python" in first_line[0].lower():
                  subprocess.run([
                      sys.executable, "-c",
                      "import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))",
                      name,
                  ], check=True)
              else:
                  subprocess.run(["bash", "-n", name], check=True)

          audit_summaries = []
          for report in sorted(out.glob("audit_*.json")):
              data = json.loads(report.read_text(encoding="utf-8"))
              audit_summaries.append({
                  "report": report.name,
                  "deviations": len(data.get("deviations", [])),
                  "observations": len(data.get("observations", [])),
                  "model_calls": data.get("model_calls", 0),
              })
          summary = [
              f"Tracked code/config files inventoried: {len(inventory)}",
              f"Tracked code/config lines inventoried: {total_lines}",
              f"Production Kotlin files passed through the whole-file vision audit: {len(production_kotlin)}",
              f"Python files syntax-compiled: {sum(name.endswith('.py') for name in paths)}",
              f"Shell scripts syntax-checked: {len(shell_files)}",
              "Audit results (findings are reported, not silently treated as a pass):",
          ]
          summary.extend(
              f"- {item['report']}: {item['deviations']} deviations, "
              f"{item['observations']} observations, {item['model_calls']} model calls"
              for item in audit_summaries
          )
          (out / "summary.txt").write_text("\n".join(summary) + "\n", encoding="utf-8")
          print("\n".join(summary))
          PY

      - name: Test whole-app source tracer
        run: python3 -m unittest discover -s tools/friday-builder -p 'test_code_trace.py' -v

      - name: Index source symbols and cross-file call relationships
        run: |
          set -euo pipefail
          python3 .ralph/code_trace.py --repo . --out-dir "$RUNNER_TEMP/friday-code-trace"

      - name: Publish code-trace summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/friday-code-trace/trace-summary.md" ]; then
            cat "$RUNNER_TEMP/friday-code-trace/trace-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Whole-app code trace did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload whole-app code trace index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-whole-app-code-trace
          path: ${{ runner.temp }}/friday-code-trace/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish source-audit summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/friday-source-audit/summary.txt" ]; then
            cat "$RUNNER_TEMP/friday-source-audit/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Whole-repository source audit did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload whole-repository source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-whole-repository-source-audit
          path: ${{ runner.temp }}/friday-source-audit/
          if-no-files-found: warn
          retention-days: 14

      # This ZIP contains owner-provided device evidence, not the Git source tree or an APK.
      - name: Upload owner-provided device evidence archive
        if: always() && hashFiles('New folder (1).zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: friday-owner-device-evidence
          path: New folder (1).zip
          if-no-files-found: error
          retention-days: 14

  report-failure:
    # Inspect every required validation lane. A skipped/failed lane is not success;
    # cancellation remains distinct and is not misreported as a test failure.
    if: ${{ !cancelled() && (needs.debug-apk.result != 'success' || needs.android-emulator.result != 'success' || needs.full-source-audit.result != 'success' || needs.jvm-unit-tests.result != 'success' || needs.jvm-test-results.result != 'success') }}
    needs:
      - debug-apk
      - android-emulator
      - full-source-audit
      - jvm-unit-tests
      - jvm-test-results
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a maintenance incident
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Friday automated maintenance: build or test failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const body = [
              '## Automated maintenance failure',
              '',
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              '',
              'Open the run and inspect the first failing step and uploaded JUnit results.',
              'This incident is diagnostic only; it does not authorize source changes, approval or release.'
            ].join('\\n');
            const match = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

  # Promote only when all mandatory validation lanes pass for this exact commit.
  verified-debug-apk:
    name: Promote verified debug APK
    if: ${{ success() }}
    needs:
      - debug-apk
      - android-emulator
      - full-source-audit
      - jvm-unit-tests
      - jvm-test-results
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download internal debug candidate
        uses: actions/download-artifact@v4
        with:
          name: unverified-debug-apk-candidate
          path: candidate

      - name: Verify APK archive and compute immutable identity
        run: |
          set -euo pipefail
          APK=candidate/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee candidate/SHA256SUMS
          echo "VERIFIED_SOURCE_COMMIT=$GITHUB_SHA" | tee candidate/SOURCE_COMMIT.txt

      - name: Publish verified install candidate
        uses: actions/upload-artifact@v4
        with:
          name: friday-verified-debug-apk
          path: |
            candidate/app-debug.apk
            candidate/SHA256SUMS
            candidate/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
