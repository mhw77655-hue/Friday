name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Writable SDK root for this job. The runner-image SDK at
      # /usr/local/lib/android/sdk is read-only; components pinned by
      # mobile/app/build.gradle.kts are installed here instead.
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17: the repo's Gradle/AGP configuration requires it. Read from
      # mobile/app/build.gradle.kts (compileOptions source/targetCompatibility =
      # VERSION_17, kotlin compilerOptions jvmTarget = JVM_17) and the root
      # build.gradle.kts (AGP 8.10.0, which requires JDK 17).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # SDK versions pinned by mobile/app/build.gradle.kts: compileSdk = 36,
      # ndkVersion = 27.3.13750724, externalNativeBuild cmake version 3.22.1,
      # AGP 8.10.0 default build-tools 35.0.0.
      - name: Install Android SDK components into writable SDK root
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          mkdir -p "$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" \
            --sdk_root="$ANDROID_HOME"

      # Device-only settings that break a clean Linux runner (AC4, no Kotlin
      # source edited): gradle.properties points android.aapt2FromMavenOverride
      # at a Termux-only /data/data/com.termux/... binary that does not exist
      # here; AGP falls back to the Maven aapt2 for this platform.
      - name: Neutralize Termux-only gradle.properties override
        run: sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :mobile:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      # Baseline unit-test run for this stage. Does NOT gate the job yet
      # (continue-on-error); results are uploaded + summarized so the current
      # baseline is recorded on every commit.
      - name: Run unit tests (baseline)
        continue-on-error: true
        run: ./gradlew :mobile:app:testDebugUnitTest

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: mobile/app/build/test-results/**/TEST-*.xml

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, os
          t = f = e = s = 0
          for p in glob.glob('mobile/app/build/test-results/**/TEST-*.xml', recursive=True):
              with open(p, encoding='utf-8', errors='replace') as fh:
                  c = fh.read()
              m = re.search(r'<testsuite\b[^>]*>', c)
              if not m:
                  continue
              def num(attr):
                  mm = re.search(r'\b%s="(\d+)"' % attr, m.group(0))
                  return int(mm.group(1)) if mm else 0
              t += num('tests'); f += num('failures'); e += num('errors'); s += num('skipped')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'## JUnit baseline\n\n{t} tests, {f} failures, {e} errors, {s} skipped\n')
          PY