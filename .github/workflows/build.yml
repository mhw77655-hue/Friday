name: build

on:
  push:
    # `audit/**` exists so the AUDIT-TOOL can prove its draft patch compiles
    # and passes the suite on a branch of its own, unmerged. Without this the
    # patch could only ever be verified by merging it, which is the one thing
    # the tool must never do. Nothing under audit/** is merged by CI or by the
    # tool; a run there is evidence, not a gate on main.
    branches: [ main, 'audit/**' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: friday-build-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  debug-apk:
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'audit/') && !startsWith(github.head_ref, 'friday-proposals/'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # JDK 17: the repo's Gradle/AGP configuration requires it. Read from
      # mobile/app/build.gradle.kts (compileOptions source/targetCompatibility =
      # VERSION_17, kotlin compilerOptions jvmTarget = JVM_17) and the root
      # build.gradle.kts (AGP 8.10.0, which requires JDK 17).
      # Read the owner's original conversation archive as source material for VISION.md.
      - name: Extract original vision chats
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, html, re
          from xml.etree import ElementTree as ET
          archive = pathlib.Path("New Folder chats.zip")
          out = pathlib.Path("vision-chat-archive-report.md")
          allowed = {".txt", ".md", ".json", ".html", ".htm", ".xml", ".csv", ".yaml", ".yml"}
          sections = ["# Original New Folder chats.zip — extracted source", ""]
          with zipfile.ZipFile(archive) as z:
              infos = [i for i in z.infolist() if not i.is_dir()]
              sections += [f"Archive entries: {len(infos)}", ""]
              sections += [f"- {i.filename} ({i.file_size} bytes)" for i in infos]
              sections += ["", "---", ""]
              for i in infos:
                  p = pathlib.PurePosixPath(i.filename)
                  if p.suffix.lower() not in allowed or i.file_size > 2_000_000:
                      continue
                  raw = z.read(i)
                  try: s = raw.decode("utf-8-sig")
                  except UnicodeDecodeError:
                      try: s = raw.decode("utf-16")
                      except UnicodeDecodeError: continue
                  if p.suffix.lower() in {".html", ".htm"}:
                      s = re.sub(r"(?is)<(script|style).*?>.*?</\\1>", " ", s)
                      s = html.unescape(re.sub(r"(?s)<[^>]+>", " ", s))
                  if p.suffix.lower() == ".xml":
                      try: s = " ".join(t.strip() for t in ET.fromstring(s).itertext() if t.strip())
                      except Exception: pass
                  sections += [f"## SOURCE: {i.filename}", "", s, "", "---", ""]
          out.write_text("\\n".join(sections), encoding="utf-8")
          print(f"Extracted archive to {out} ({out.stat().st_size} bytes)")
          PY
      - name: Upload original vision source extraction
        uses: actions/upload-artifact@v4
        with:
          name: original-vision-chat-extraction
          path: vision-chat-archive-report.md
          retention-days: 3

      - name: Verify Ralph receives the owner's vision and direct words
        run: bash .ralph/owner_vision_check.sh

      - name: Set up Python for Friday builder contract tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Friday repository-builder safety contracts
        run: python3 -m unittest discover -s tools/friday-builder -p 'test_*.py' -v

      - name: Set up Go for workflow lint
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Lint all GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Writable SDK root for this job. MUST be exported inside a step (not in
      # a job-level env block): the runner context is not allowed there and
      # GitHub rejects the whole workflow. The runner-image SDK at
      # /usr/local/lib/android/sdk is read-only, so components pinned by
      # mobile/app/build.gradle.kts go here instead.
      - name: Set ANDROID_HOME for the job
        run: |
          echo "ANDROID_HOME=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"

      # SDK versions pinned by mobile/app/build.gradle.kts: compileSdk = 36,
      # ndkVersion = 27.3.13750724, externalNativeBuild cmake version 3.22.1,
      # AGP 8.10.0 default build-tools 35.0.0.
      - name: Install Android SDK components into writable SDK root
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          mkdir -p "$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" \
            --sdk_root="$ANDROID_HOME"

      # Device-only settings that break a clean Linux runner (AC4, no Kotlin
      # source edited): gradle.properties points android.aapt2FromMavenOverride
      # at a Termux-only /data/data/com.termux/... binary that does not exist
      # here; AGP falls back to the Maven aapt2 for this platform.
      - name: Neutralize Termux-only gradle.properties override
        run: sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :mobile:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      # Baseline unit-test run for this stage.
      - name: Run unit tests (baseline)
        run: ./gradlew :mobile:app:testDebugUnitTest

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: mobile/app/build/test-results/**/TEST-*.xml

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, os
          paths = glob.glob('mobile/app/build/test-results/**/TEST-*.xml', recursive=True)
          if not paths:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## JUnit baseline\n\nNO JUNIT FILES: the tests did not run\n')
              raise SystemExit(0)
          t = f = e = s = 0
          for p in paths:
              with open(p, encoding='utf-8', errors='replace') as fh:
                  c = fh.read()
              m = re.search(r'<testsuite\b[^>]*>', c)
              if not m:
                  continue
              def num(attr):
                  mm = re.search(r'\b%s="(\d+)"' % attr, m.group(0))
                  return int(mm.group(1)) if mm else 0
              t += num('tests'); f += num('failures'); e += num('errors'); s += num('skipped')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'## JUnit baseline\n\n{t} tests, {f} failures, {e} errors, {s} skipped\n')
          PY

  report-failure:
    if: failure()
    needs: debug-apk
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a maintenance incident
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Friday automated maintenance: build or test failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const body = [
              '## Automated maintenance failure',
              '',
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              '',
              'Open the run and inspect the first failing step and uploaded JUnit results.',
              'This incident is diagnostic only; it does not authorize source changes, approval or release.'
            ].join('\\n');
            const match = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
