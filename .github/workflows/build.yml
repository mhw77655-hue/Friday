name: build

on:
  push:
    # Branch candidates are validated by pull_request (or explicit
    # workflow_dispatch for the trusted publisher); only main needs push CI.
    # This avoids duplicate push + PR builds for every candidate commit.
    branches: [ main ]
  pull_request:
    branches: [ main, 'audit/**' ]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: friday-build-v2-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Preserve the active candidate's full validation; newer commits wait their turn.
  # A newer PR commit supersedes stale validation; never cancel mainline validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Run the same build/test gate for every PR, including audit and proposal
  # branches. Draft PRs still need real validation; skipping their only job
  # makes the check appear neutral without testing the candidate.
  debug-apk:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # JDK 17: the repo's Gradle/AGP configuration requires it. Read from
      # mobile/app/build.gradle.kts (compileOptions source/targetCompatibility =
      # VERSION_17, kotlin compilerOptions jvmTarget = JVM_17) and the root
      # build.gradle.kts (AGP 8.10.0, which requires JDK 17).
      - name: Verify Ralph receives the owner's vision and direct words
        run: bash .ralph/owner_vision_check.sh

      - name: Set up Python for Friday builder contract tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Friday repository-builder safety contracts
        run: python3 -m unittest discover -s tools/friday-builder -p 'test_*.py' -v

      - name: Set up Go for workflow lint
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Lint all GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Writable SDK root for this job. MUST be exported inside a step (not in
      # a job-level env block): the runner context is not allowed there and
      # GitHub rejects the whole workflow. The runner-image SDK at
      # /usr/local/lib/android/sdk is read-only, so components pinned by
      # mobile/app/build.gradle.kts go here instead.
      - name: Set ANDROID_HOME for the job
        id: android-home
        run: |
          echo "ANDROID_HOME=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> "$GITHUB_ENV"

      # SDK versions pinned by mobile/app/build.gradle.kts: compileSdk = 36,
      # ndkVersion = 27.3.13750724, externalNativeBuild cmake version 3.22.1,
      # AGP 8.10.0 default build-tools 35.0.0.
      - name: Install Android SDK components into writable SDK root
        id: install-sdk
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          mkdir -p "$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" \
            --sdk_root="$ANDROID_HOME"

      # Verify the app builds from its repository checkout without rewriting
      # a device-local binary path during CI.
      - name: Verify no Termux-only Android build override remains
        run: |
          if grep -n '^android.aapt2FromMavenOverride=' gradle.properties; then
            echo "Remove the device-local aapt2 override from gradle.properties."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: assemble-apk
        run: ./gradlew :mobile:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Detect release-signing changes
        id: release_signing_diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_SHA"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          if grep -Eq '^(mobile/app/build.gradle.kts|\.github/workflows/release.yml)$' <<< "$CHANGED"; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify release variant with a disposable CI key
        if: steps.release_signing_diff.outputs.run_smoke == 'true'
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/friday-ci-smoke.p12"
          PASSWORD="friday-ci-smoke-password"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias friday-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Friday CI Smoke,O=Friday,C=EG"
          FRIDAY_RELEASE_KEYSTORE_PATH="$KEYSTORE" \
          FRIDAY_RELEASE_STORE_PASSWORD="$PASSWORD" \
          FRIDAY_RELEASE_KEY_ALIAS="friday-release" \
          FRIDAY_RELEASE_KEY_PASSWORD="$PASSWORD" \
            ./gradlew :mobile:app:assembleRelease \
              -PfridayVersionCode=2001 \
              -PfridayVersionName=ci-smoke \
              -PfridayAbiFilters=arm64-v8a
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            mobile/app/build/outputs/apk/release/app-release.apk

      # Run tests even when APK assembly fails. A failed packaging step must
      # not erase independent evidence about source/test health.
      - name: Run unit tests independently of APK assembly
        if: ${{ !cancelled() && steps.setup-java.outcome == 'success' && steps.android-home.outcome == 'success' && steps.install-sdk.outcome == 'success' }}
        run: ./gradlew :mobile:app:testDebugUnitTest

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: mobile/app/build/test-results/**/TEST-*.xml

      - name: Summarize test results
        if: always()
        env:
          APK_STEP_OUTCOME: ${{ steps.assemble-apk.outcome }}
        run: |
          python3 - <<'PY'
          import glob, re, os
          paths = glob.glob('mobile/app/build/test-results/**/TEST-*.xml', recursive=True)
          if not paths:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## JUnit results\n\nNO JUNIT FILES: the test task produced no results. This is not a passing test run.\n')
              raise SystemExit(1)
          t = f = e = s = 0
          for p in paths:
              with open(p, encoding='utf-8', errors='replace') as fh:
                  c = fh.read()
              m = re.search(r'<testsuite\b[^>]*>', c)
              if not m:
                  continue
              def num(attr):
                  mm = re.search(r'\b%s="(\d+)"' % attr, m.group(0))
                  return int(mm.group(1)) if mm else 0
              t += num('tests'); f += num('failures'); e += num('errors'); s += num('skipped')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'## JUnit results\n\n{t} tests, {f} failures, {e} errors, {s} skipped\n')
              out.write(f'\nAPK assembly step: {os.environ.get("APK_STEP_OUTCOME", "see job steps")}\n')
              out.write('A skipped workflow step is not reported as a successful test. Inspect the step conclusion above.\n')
          if t == 0:
              raise SystemExit('JUnit report contains zero executed tests; validation is incomplete.')
          if f or e:
              raise SystemExit(f'JUnit reports {f} failures and {e} errors.')
          PY


  # A disposable Android device for real app-process/service instrumentation.
  # This is a reproducible emulator baseline, not a bit-for-bit clone of the
  # owner's handset. No account data, credentials or personal app data enter it.
  android-emulator:
    name: Disposable Android phone twin (instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create isolated writable Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install emulator and pinned native build components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" \
            "system-images;android-35;google_apis;x86_64"

      - name: Build app and instrumentation APKs
        run: ./gradlew :mobile:app:assembleDebug :mobile:app:assembleDebugAndroidTest

      - name: Enable KVM acceleration for the disposable phone
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This runner does not expose /dev/kvm; x86_64 software emulation is too slow and unreliable for the instrumented phone gate."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The runner cannot access /dev/kvm after permission setup."
            ls -l /dev/kvm || true
            exit 1
          fi
          echo "ANDROID_KVM_READY: hardware acceleration is available"

      - name: Boot disposable virtual phone and apply sanitized baseline state
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect -memory 4096 -cores 4 -no-snapshot -wipe-data -timezone Etc/UTC
          script: bash tools/friday-builder/run_virtual_phone_tests.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-virtual-phone-evidence
          path: |
            mobile/app/build/reports/androidTests/
            mobile/app/build/outputs/androidTest-results/
            mobile/app/build/test-results/
            ${{ runner.temp }}/friday-emulator/
          if-no-files-found: warn
          retention-days: 7

  full-source-audit:
    name: Whole-repository source inventory and Kotlin vision audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inventory every tracked code file and audit all production Kotlin
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/friday-source-audit"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "friday-source-audit"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          paths = [p for p in paths if p]
          source_suffixes = {
              ".kt", ".kts", ".java", ".py", ".go", ".js", ".ts", ".tsx", ".jsx",
              ".sh", ".yml", ".yaml", ".gradle", ".xml", ".toml", ".properties",
          }
          inventory = []
          total_lines = 0
          for name in paths:
              if pathlib.PurePosixPath(name).suffix.lower() not in source_suffixes:
                  continue
              content = (root / name).read_text(encoding="utf-8", errors="replace")
              count = len(content.splitlines())
              total_lines += count
              inventory.append((name, count))
          inventory.sort()
          (out / "source-inventory.tsv").write_text(
              "lines\tpath\n" + "".join(f"{count}\t{name}\n" for name, count in inventory),
              encoding="utf-8",
          )

          production_kotlin = [
              name for name in paths
              if name.startswith("mobile/app/src/main/java/") and name.endswith(".kt")
          ]
          if not production_kotlin:
              raise SystemExit("No production Kotlin source files were found.")
          command = [
              sys.executable, ".ralph/audit.py", "--paths", *production_kotlin,
              "--no-model", "--out-dir", str(out),
          ]
          subprocess.run(command, check=True)
          subprocess.run([
              sys.executable, ".ralph/audit.py", "--self-audit",
              "--no-model", "--out-dir", str(out),
          ], check=True)

          subprocess.run([sys.executable, "-m", "compileall", "-q", ".ralph", "tools/friday-builder"], check=True)
          shell_files = [name for name in paths if name.endswith(".sh")]
          for name in shell_files:
              subprocess.run(["bash", "-n", name], check=True)

          audit_summaries = []
          for report in sorted(out.glob("audit_*.json")):
              data = json.loads(report.read_text(encoding="utf-8"))
              audit_summaries.append({
                  "report": report.name,
                  "deviations": len(data.get("deviations", [])),
                  "observations": len(data.get("observations", [])),
                  "model_calls": data.get("model_calls", 0),
              })
          summary = [
              f"Tracked code/config files inventoried: {len(inventory)}",
              f"Tracked code/config lines inventoried: {total_lines}",
              f"Production Kotlin files passed through the whole-file vision audit: {len(production_kotlin)}",
              f"Python files syntax-compiled: {sum(name.endswith('.py') for name in paths)}",
              f"Shell scripts syntax-checked: {len(shell_files)}",
              "Audit results (findings are reported, not silently treated as a pass):",
          ]
          summary.extend(
              f"- {item['report']}: {item['deviations']} deviations, "
              f"{item['observations']} observations, {item['model_calls']} model calls"
              for item in audit_summaries
          )
          (out / "summary.txt").write_text("\n".join(summary) + "\n", encoding="utf-8")
          print("\n".join(summary))
          PY

      - name: Publish source-audit summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/friday-source-audit/summary.txt" ]; then
            cat "$RUNNER_TEMP/friday-source-audit/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Whole-repository source audit did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload whole-repository source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-whole-repository-source-audit
          path: ${{ runner.temp }}/friday-source-audit/
          if-no-files-found: warn
          retention-days: 14

  report-failure:
    # Inspect every required validation lane. A skipped/failed lane is not success;
    # cancellation remains distinct and is not misreported as a test failure.
    if: ${{ !cancelled() && (needs.debug-apk.result != 'success' || needs.android-emulator.result != 'success' || needs.full-source-audit.result != 'success') }}
    needs:
      - debug-apk
      - android-emulator
      - full-source-audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a maintenance incident
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Friday automated maintenance: build or test failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const body = [
              '## Automated maintenance failure',
              '',
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              '',
              'Open the run and inspect the first failing step and uploaded JUnit results.',
              'This incident is diagnostic only; it does not authorize source changes, approval or release.'
            ].join('\\n');
            const match = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
