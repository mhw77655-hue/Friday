name: One-time Friday identity migration

on:
  push:
    branches: [ main ]
    paths:
      - .friday-identity-migration.trigger

permissions: {}

concurrency:
  group: friday-identity-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Execute complete identity and repository normalization
        run: |
          set -euo pipefail
          python3 scripts/perform_friday_identity_migration.py
          git diff --check

      - name: Verify package identity and source tree
        run: |
          set -euo pipefail
          grep -q 'namespace = "ai.friday.assistant"' mobile/app/build.gradle.kts
          grep -q 'applicationId = "ai.friday.assistant"' mobile/app/build.gradle.kts
          test -d mobile/app/src/main/java/ai/friday/assistant
          test -d mobile/app/src/test/java/ai/friday/assistant
          if find mobile/app/src -path '*/com/jarvis/app*' -print -quit | grep -q .; then
            echo "::error::Old Jarvis source package path remains."
            exit 1
          fi
          if grep -RIl --include='*.kt' --include='*.java' 'com.jarvis.app' mobile/app/src | grep -q .; then
            echo "::error::Old Jarvis package declaration remains."
            exit 1
          fi
          if grep -RIl 'Java_com_jarvis_app' mobile/app/src/main/cpp | grep -q .; then
            echo "::error::Old JNI symbols remain."
            exit 1
          fi
          grep -RIl 'Java_ai_friday_assistant' mobile/app/src/main/cpp | grep -q .
          if grep -RInE '<uses-permission[^>]*android.permission.MANAGE_EXTERNAL_STORAGE' mobile/app/src/main --include='AndroidManifest.xml'; then
            echo "::error::Broad external-storage permission is declared in an app manifest."
            exit 1
          fi
          test ! -e mobile/app/src/main/java/ai/friday/assistant/ObsidianSync.kt
          grep -q 'android:label="Friday"' mobile/app/src/main/AndroidManifest.xml
          test ! -e mobile/app/src/main/java/ai/friday/assistant/ObsidianSync.kt
          test -f mobile/app/src/main/java/ai/friday/assistant/LocalTurnJournal.kt
          if find mobile/app/src/main/java -type f \\
            \\( -name 'GitHubTokenStore.kt' -o -name 'GitHubDeviceChannel.kt' -o -name 'FridayEvolutionWorker.kt' \\) \\
            -print -quit | grep -q .; then
            echo "::error::Retired public GitHub phone bridge source remains."
            exit 1
          fi
          if find mobile/app/src/main/java -type f \\
            \\( -name '*VoiceForge*.kt' -o -name 'ToolBuilder.kt' -o -name 'ToolBuilderComposition.kt' \\) \\
            -print -quit | grep -q .; then
            echo "::error::Retired prototype source remains in the production source set."
            exit 1
          fi
          if find mobile/app/src/main/java -type f -path '*/buildtwin/*' -print -quit | grep -q .; then
            echo "::error::Retired BuildTwin prototype remains in the production source set."
            exit 1
          fi
          grep -q 'application_id": "ai.friday.assistant"' .github/workflows/release.yml || grep -q 'ai.friday.assistant' .github/workflows/release.yml

      - name: Build the fresh Friday debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :mobile:app:assembleDebug

      - name: Run the complete Friday JVM unit-test suite
        run: ./gradlew :mobile:app:testDebugUnitTest

      - name: Commit the verified identity migration to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete fresh Friday identity migration"

          # main may advance while the long build/test transaction is running.
          # Reconcile against the latest main; never force-push or overwrite it.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Migration conflicts with newer main; candidate remains uncommitted."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during push attempt $attempt; retrying after fetch/rebase"
            sleep 2
          done
          echo "::error::Could not commit migration after three bounded mainline retries."
          exit 1

      - name: Dispatch full mainline validation after migration commit
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref main --repo "$GITHUB_REPOSITORY"

