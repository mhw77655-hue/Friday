name: Inspect original vision chat archive
on:
  push:
    branches:
      - audit/friday-self-evolution-device-bridge
    paths:
      - "New Folder chats.zip"
      - ".github/workflows/inspect-vision-chat-archive.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract readable source from original chat archive
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, json, html, re
          from xml.etree import ElementTree as ET
          archive = pathlib.Path("New Folder chats.zip")
          out = pathlib.Path("vision-chat-archive-report.md")
          allowed = {".txt", ".md", ".json", ".html", ".htm", ".xml", ".csv", ".yaml", ".yml"}
          sections = ["# Original New Folder chats.zip — extracted source", ""]
          with zipfile.ZipFile(archive) as z:
              infos = [i for i in z.infolist() if not i.is_dir()]
              sections += [f"Archive entries: {len(infos)}", ""]
              for i in infos:
                  p = pathlib.PurePosixPath(i.filename)
                  sections.append(f"- {i.filename} ({i.file_size} bytes)")
              sections += ["", "---", ""]
              for i in infos:
                  p = pathlib.PurePosixPath(i.filename)
                  if p.suffix.lower() not in allowed or i.file_size > 2_000_000:
                      continue
                  raw = z.read(i)
                  try: s = raw.decode("utf-8-sig")
                  except UnicodeDecodeError:
                      try: s = raw.decode("utf-16")
                      except UnicodeDecodeError: continue
                  if p.suffix.lower() in {".html", ".htm"}:
                      s = re.sub(r"(?is)<(script|style).*?>.*?</\\1>", " ", s)
                      s = re.sub(r"(?s)<[^>]+>", " ", s)
                      s = html.unescape(s)
                  if p.suffix.lower() == ".xml":
                      try:
                          root = ET.fromstring(s)
                          s = " ".join(t.strip() for t in root.itertext() if t.strip())
                      except Exception: pass
                  sections += [f"## SOURCE: {i.filename}", "", s, "", "---", ""]
          out.write_text("\\n".join(sections), encoding="utf-8")
          print(f"Created {out} ({out.stat().st_size} bytes)")
          print("\\n".join(sections[:min(len(sections), 120)]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-vision-chat-extraction
          path: vision-chat-archive-report.md
          retention-days: 3
